<!DOCTYPE html>
<!-- Wild Italy · prova del barattolo 3D (salsa tartufata 130 g): tutto il barattolo, da girare come si vuole.
     Lo sfondo per ora non c'è: c'è una sfumatura calda, disegnata dentro il 3D (sfumatura() in
     barattolo-3d.js). Quando arriva una foto va lì al suo posto, non dietro al canvas. -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Barattolo 3D · Wild Italy</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:,">
<style>
  body{margin:0;background:#1b1510;color:#e8dcc6;font:13px/1.4 system-ui,sans-serif}
  /* il fondo lo disegna il 3D (sfumatura calda): qui basta il colore giusto prima che si carichi */
  .vista{height:100svh;cursor:grab;touch-action:none;background:#241c14}
  .vista:active{cursor:grabbing}
  .nota,.nome{position:fixed;left:16px;right:16px;margin:0;text-align:center;pointer-events:none}
  .nota{top:20px;color:#b7a688}
  .nome{bottom:24px;font:600 18px/1.2 Georgia,serif;color:#f1e6cf}
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div class="vista" data-3d role="img" aria-label="Salsa tartufata 130 g in 3D: trascina per girare il barattolo"></div>
<p class="nota">Trascina per girarlo · rotella o due dita per avvicinarti</p>
<p class="nome">Salsa tartufata 130 g</p>
<script type="module">
  import { monta } from "./barattolo-3d.js";
  const c = monta(document.querySelector("[data-3d]"), await (await fetch("modello.json")).json());
  /* per le prove: __gira(gradi) mette il barattolo a un angolo preciso, senza trascinare */
  window.__gira = (gradi, alto = 1.33) => {
    c.object.position.setFromSphericalCoords(c.object.position.length(), alto, gradi * Math.PI / 180);
    c.update();
  };
</script>
</body>
</html>
