<!DOCTYPE html>
<!-- Wild Italy · prova delle bottiglie 3D, non collegata al resto del sito -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova 3D · Wild Italy</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/wild.css">
<style>
  .p3d{height:100svh;background:var(--paper);cursor:grab;touch-action:none}
  .p3d:active{cursor:grabbing}
  .p3d__nota{position:fixed;left:0;right:0;top:20px;text-align:center;pointer-events:none}
  .p3d__nome{position:fixed;left:0;right:0;bottom:56px;text-align:center;pointer-events:none}
  .p3d__punti{position:fixed;left:0;right:0;bottom:8px;justify-content:center}
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div class="p3d" data-3d></div>
<p class="meta p3d__nota">Trascina per girare la bottiglia · rotella o due dita per avvicinarti</p>
<p class="meta p3d__nome" data-nome></p>
<nav class="dots p3d__punti" aria-label="Vini" data-punti></nav>

<script type="module">
  import { monta } from "./assets/js/bottiglia-3d.js";

  /* Misure prese sulle foto, in pixel di ciascuna foto (il profilo sul corpo dritto è una retta: niente onde di un pixel). Righe dritte (quelle ai lati della sagoma) per le etichette;
     curva: quanto scendono al centro le linee orizzontali, in raggi, misurato su bordo capsula, cima e fondo etichetta */
  const BOTTIGLIE = {
    "napos-rosso": {
      nome: "Napo's · Umbria IGT Rosso",
      fronte: {
        src: "assets/img/napos-napolini-1.jpg", alto: 190, basso: 2480, cx: [974.5, 958],
        capsula: [190, 651],
        curva: [[651, -0.004], [1298, 0.108], [2283, 0.2107]],
        /* medaglione che sporge sopra l'etichetta; etichetta, coi lati misurati: è incollata appena storta */
        etichette: [[1195, 1299.5, -0.35, 0.35], [1299.5, 2281.5, [-0.9443, -0.9481], [0.9387, 0.9464]]],
        /* l'incavo nero in cima all'etichetta, attorno al medaglione, è vetro */
        trasparente: [1190, 1470, -0.47, 0.47]
      },
      retro: {
        src: "assets/img/napos-napolini-2.jpg", alto: 190, basso: 2456, cx: [1018.5, 1018.5],
        curva: [[654, -0.123], [1562, 0.132], [2127, 0.2025]],
        /* retroetichetta con la fascia nera NAPOLINI a destra */
        etichette: [[1563.5, 2125.5, [-0.8733, -0.8822], 0.886]]
      },
      scritta: { testo: "NAPOLINI", righe: [561, 597], inizio: -64.2, arco: 128.3 },
      lamina: [135, 32, 43], /* capsula dove la luce la prende di fronte, media delle due foto */
      oro: [185, 150, 115], /* il corpo delle lettere, fra i bordi sfumati e i lampi */
      profilo: [
        [73, 190], [94, 195], [99.5, 200], [105.5, 210], [107, 220], [108.5, 235], [110, 500],
        [111.5, 760], [113.5, 780], [119.5, 800], [130, 820], [150.5, 840], [178, 860], [200.5, 880],
        [219.5, 900], [235, 920], [248, 940], [259, 960], [267.5, 980], [274.5, 1000], [279.5, 1020],
        [283.5, 1040], [285.5, 1060], [286, 1080], [284, 1700], [281, 2380], [281.5, 2404], [277, 2420],
        [272.5, 2436], [267, 2452], [258, 2468], [253.5, 2480]
      ]
    },
    "grechetto-napolini": {
      nome: "Clara Vinea · Grechetto Colli Martani DOC",
      fronte: {
        src: "assets/img/grechetto-napolini-1.jpg", alto: 144, basso: 1198, cx: [528.5, 522.6],
        capsula: [144, 362],
        curva: [[362, -0.0176], [806.5, 0.1318], [1140, 0.1962]],
        etichette: [[807.5, 1139, [-0.9045, -0.9061], [0.9323, 0.9348]]]
      },
      retro: {
        src: "assets/img/grechetto-napolini-2.jpg", alto: 262, basso: 2272, cx: [989.8, 990.2],
        curva: [[671.5, 0.0662], [1580.7, 0.1461], [2080, 0.2235]],
        etichette: [[1581.7, 2079, [-0.8006, -0.8021], 0.852]]
      },
      /* sulla capsula la scritta non è centrata: comincia poco a sinistra del centro della foto */
      scritta: { testo: "NAPOLINI", righe: [316, 333], inizio: -34.4, arco: 136 },
      /* vino chiaro: bottiglia trasparente; paglierino, pieno fin quasi sotto la capsula */
      vino: { colore: [224, 214, 132], livello: 387 },
      lamina: [39, 53, 46],
      oro: [174, 171, 155],
      profilo: [
        [48.5, 144], [51, 152], [52, 168], [55, 172], [55, 200], [52, 208], [57, 372], [63.5, 416], [68, 444],
        [79.5, 488], [85.5, 508], [90.5, 524], [113, 588], [118, 604], [123, 620], [129, 640], [131, 644],
        [131.5, 652], [140.5, 696], [147, 796], [145, 1172], [141.5, 1184], [136, 1198]
      ]
    },
    "vigna-rosa-napolini": {
      nome: "Vigna Rosa · Umbria IGT Rosato",
      fronte: {
        src: "assets/img/vigna-rosa-napolini-1.jpg", alto: 149, basso: 1212, cx: [540.2, 535.6],
        capsula: [149, 370],
        curva: [[370, 0.0145], [637, 0.0955], [1136.6, 0.2175]],
        etichette: [[638.2, 1135.6, [-0.919, -0.913], [0.9449, 0.949]]]
      },
      retro: {
        src: "assets/img/vigna-rosa-napolini-2.jpg", alto: 159, basso: 1219, cx: [510.2, 506.8],
        curva: [[377, 0.0199], [782, 0.1291], [1052.4, 0.1973]],
        etichette: [[783.2, 1051.4, [-0.8664, -0.8669], 0.859]]
      },
      /* davanti si legge "POLINI": la scritta finisce poco a destra del centro */
      scritta: { testo: "NAPOLINI", righe: [321, 339], inizio: -125.3, arco: 150.8 },
      /* rosato: salmone; nel collo, sotto la capsula, c'è un dito d'aria */
      vino: { colore: [244, 152, 140], livello: 424 },
      lamina: [146, 34, 64],
      oro: [238, 191, 188],
      profilo: [
        [50, 149], [54.5, 173], [56, 177], [57, 205], [53.5, 217], [57.5, 421], [62, 437], [73, 457], [77.5, 461],
        [80.5, 465], [89.5, 473], [110, 497], [118, 509], [129, 533], [131, 541], [134, 549], [137, 693],
        [135, 1149], [128.5, 1185], [122.5, 1201], [118.5, 1205], [116.8, 1212]
      ]
    }
  };

  /* un vino alla volta: i puntini ricaricano la pagina con l'altro */
  const scelto = BOTTIGLIE[new URLSearchParams(location.search).get("b")] ? new URLSearchParams(location.search).get("b") : "napos-rosso";
  document.querySelector("[data-nome]").textContent = BOTTIGLIE[scelto].nome;
  document.querySelector("[data-punti]").innerHTML = Object.entries(BOTTIGLIE)
    .map(([slug, b]) => `<button type="button" data-b="${slug}" aria-label="${b.nome}"${slug === scelto ? ' aria-current="true"' : ""}></button>`)
    .join("");
  document.querySelector("[data-punti]").addEventListener("click", (e) => {
    const p = e.target.closest("[data-b]");
    if (p && p.dataset.b !== scelto) location.search = "?b=" + p.dataset.b;
  });
  monta(document.querySelector("[data-3d]"), BOTTIGLIE[scelto]);
</script>
</body>
</html>
