<!DOCTYPE html>
<!-- Wild Italy · prova della bottiglia 3D, non collegata al resto del sito -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova 3D · Wild Italy</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/wild.css">
<style>
  .p3d{height:100svh;background:var(--paper);cursor:grab;touch-action:none}
  .p3d:active{cursor:grabbing}
  .p3d__nota{position:fixed;left:0;right:0;top:20px;text-align:center;pointer-events:none}
</style>
<script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  } }
</script>
</head>
<body>
<div class="p3d" data-3d></div>
<p class="meta p3d__nota">Trascina per girare la bottiglia · rotella o due dita per avvicinarti</p>

<script type="module">
  import { monta } from "./assets/js/bottiglia-3d.js";

  /* Napo's rosso: misure prese sulle due foto (2000 × 2666 px) */
  monta(document.querySelector("[data-3d]"), {
    fronte: {
      src: "assets/img/napos-napolini-1.jpg", alto: 190, basso: 2480, cx: [974.5, 958],
      capsula: [190, 651],
      /* quanto scendono al centro le linee orizzontali, in raggi: misurato su bordo capsula, cima e fondo etichetta */
      curva: [[651, -0.004], [1298, 0.108], [2283, 0.2107]],
      /* medaglione che sporge sopra l'etichetta; etichetta, coi lati misurati: è incollata appena storta */
      etichette: [[1195, 1299.5, -0.35, 0.35], [1299.5, 2281.5, [-0.9443, -0.9481], [0.9387, 0.9464]]],
      /* l'incavo nero in cima all'etichetta, attorno al medaglione, è vetro */
      trasparente: [1190, 1470, -0.47, 0.47]
    },
    retro: {
      src: "assets/img/napos-napolini-2.jpg", alto: 190, basso: 2456, cx: [1018.5, 1018.5],
      curva: [[654, -0.123], [1562, 0.132], [2127, 0.2025]],
      /* retroetichetta con la fascia nera NAPOLINI a destra */
      etichette: [[1563.5, 2125.5, [-0.8733, -0.8822], 0.886]]
    },
    vetro: [4, 5, 7],
    oro: [185, 150, 115], /* scritta sulla capsula: il corpo delle lettere, fra i bordi sfumati nel rosso e i lampi */
    scritta: { testo: "NAPOLINI", righe: [561, 597], s: 0.9 },
    lamina: [135, 32, 43], /* capsula dove la luce la prende di fronte, media delle due foto: (127, 30, 40) e (143, 35, 46) */
    profilo: [
      [73, 190], [94, 195], [99.5, 200], [105.5, 210], [107, 220], [108.5, 235], [110, 500],
      [111.5, 760], [113.5, 780], [119.5, 800], [130, 820], [150.5, 840], [178, 860], [200.5, 880],
      [219.5, 900], [235, 920], [248, 940], [259, 960], [267.5, 980], [274.5, 1000], [279.5, 1020],
      [283.5, 1040], [285.5, 1060], [286, 1080], [284, 1700], [281, 2380], [281.5, 2404], [277, 2420],
      [272.5, 2436], [267, 2452], [258, 2468], [253.5, 2480]
    ]
  });
</script>
</body>
</html>
